server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same as vercel.json: keeps the opener handle Firebase signInWithPopup needs.
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames, so these can be cached forever.
    location /assets/ {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /dashboard, /patients/123 etc. are client-side routes.
    # index.html must never be cached, or users keep a stale bundle after a deploy.
    location / {
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
